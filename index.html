    <!-- Script de Bloqueio Rigoroso de Zoom Acidental (Scroll Ctrl+Rodinha, Atalhos de Teclado e Gestos) -->
    <script>
      (function() {
        // 1. Interceptar e bloquear zoom na rolagem do mouse com Ctrl (wheel + ctrlKey)
        window.addEventListener('wheel', function(e) {
          if (e.ctrlKey) {
            e.preventDefault();
          }
        }, { passive: false });

        // 2. Interceptar e bloquear atalhos comuns de teclado para zoom (Ctrl + "+", "-", "0", "=", numpad)
        window.addEventListener('keydown', function(e) {
          if (e.ctrlKey || e.metaKey) {
            if (
              e.key === '+' || 
              e.key === '-' || 
              e.key === '=' || 
              e.key === '0' || 
              e.code === 'NumpadAdd' || 
              e.code === 'NumpadSubtract' || 
              e.code === 'Numpad0' || 
              e.code === 'Digit0' || 
              e.code === 'Equal' || 
              e.code === 'Minus'
            ) {
              e.preventDefault();
            }
          }
        }, { passive: false });

        // 3. Bloquear gestos de pinça / zoom em trackpads Safari/Chrome
        window.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
        window.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
        window.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });

        // 4. Bloquear multi-touch zoom acidental em telas sensíveis ao toque
        document.addEventListener('touchstart', function(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });
      })();
    </script>
